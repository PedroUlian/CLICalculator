name: Cross-Platform Build (CMake + Matrix)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.artifact-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            artifact-name: linux-x64
            suffix: ""
          - os: ubuntu-latest
            target: aarch64-linux-gnu
            artifact-name: linux-arm64
            suffix: ""
          - os: windows-latest
            target: x86_64-windows-gnu
            artifact-name: win-x64
            suffix: ".exe"
          - os: windows-latest
            target: aarch64-windows-gnu
            artifact-name: win-arm64
            suffix: ".exe"
          - os: macos-latest
            target: x86_64-macos-none
            artifact-name: mac-x64
            suffix: ""
          - os: macos-latest
            target: aarch64-macos-none
            artifact-name: mac-arm64
            suffix: ""

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.13.0

 
    - name: Build
      shell: bash
      run: |
        ZIG_PATH=$(which zig)
        
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          [[ "$ZIG_PATH" != *.exe ]] && ZIG_PATH="${ZIG_PATH}.exe"
          ZIG_PATH=$(cygpath -m "$ZIG_PATH")
        fi
        
        CMAKE_OPTS=(
          "-B" "build"
          "-DCMAKE_C_COMPILER=$ZIG_PATH"
          "-DCMAKE_C_COMPILER_ARG1=cc"
          "-DCMAKE_C_FLAGS=-target ${{ matrix.target }} -static"
          "-DCMAKE_C_COMPILER_WORKS=1"
          "-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY"
          "-DCMAKE_BUILD_TYPE=Release"
        )

        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          CMAKE_OPTS+=("-G" "MinGW Makefiles")
          CMAKE_OPTS+=("-DCMAKE_SYSTEM_NAME=Windows")
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          CMAKE_OPTS+=("-DCMAKE_SYSTEM_NAME=Darwin")
        else
          CMAKE_OPTS+=("-DCMAKE_SYSTEM_NAME=Linux")
        fi

        cmake "${CMAKE_OPTS[@]}"
        
        cmake --build build --config Release

    - name: Prepare Output
      shell: bash
      run: |
        mkdir -p output
        
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cp $(find build -name "calc.exe" | head -n 1) output/calc-${{ matrix.artifact-name }}.exe
        else
          cp $(find build -name "calc" -type f | head -n 1) output/calc-${{ matrix.artifact-name }}
        fi
        echo "Conteúdo da pasta output:"
        ls -lh output
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.artifact-name }}
        path: output/*
