name: Cross-Platform Build (Zig + Static libmpdec)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.13.0

    - name: Build All Platforms
      run: |
        mkdir -p artifacts
        ZIG_PATH=$(which zig)

        targets=(
          "linux-x64|x86_64-linux-gnu|Linux|"
          "linux-arm64|aarch64-linux-gnu|Linux|"
          "win-x64|x86_64-windows-gnu|Windows|.exe"
          "win-arm64|aarch64-windows-gnu|Windows|.exe"
          "mac-x64|x86_64-macos-none|Darwin|"
          "mac-arm64|aarch64-macos-none|Darwin|"
        )

        for t in "${targets[@]}"; do
          IFS='|' read -r folder target system suffix <<< "$t"
          echo "--- Compilando para $folder ($target) ---"
          
          rm -rf "build-$folder"

          cmake -G "Unix Makefiles" -B "build-$folder" \
            -DCMAKE_SYSTEM_NAME="$system" \
            -DCMAKE_C_COMPILER="$ZIG_PATH" \
            -DCMAKE_C_COMPILER_ARG1="cc;-target;$target" \
            -DCMAKE_AR="$ZIG_PATH" \
            -DCMAKE_NM="$ZIG_PATH" \
            -DCMAKE_RANLIB="$ZIG_PATH" \
            -DCMAKE_C_COMPILER_AR="$ZIG_PATH" \
            -DCMAKE_C_COMPILER_RANLIB="$ZIG_PATH" \
            -DCMAKE_NM_FLAGS="nm" \
            -DCMAKE_AR_FLAGS="ar;rc" \
            -DCMAKE_RANLIB_FLAGS="ranlib" \
            -DCMAKE_C_COMPILER_WORKS=1 \
            -DCMAKE_EXECUTABLE_SUFFIX="$suffix"
          
          cmake --build "build-$folder" --config Release
          
          cp "build-$folder/calc$suffix" "artifacts/calc-$folder$suffix"
        done

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: multiplatform-binaries
        path: artifacts/*
